# dd-song-miner-llm DeepSeek 配置模板
# 复制为 config.yaml 后填入你的 DeepSeek API key。

asr:
  model: small
  device: auto
  compute_type: default
  language: null
  beam_size: 5
  vad_filter: true
  initial_prompt: null

llm:
  api_key: sk-be0800eaf21e4d619dcd697b3c9fef29
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.1
  max_tokens: 4096
  max_completion_tokens: null
  retry_empty_with_reasoning: true
  reasoning_followup_rounds: 2
  reasoning_followup_max_tokens: 8192
  batch_size: null
  fallbacks: []

padding:
  before_seconds: 3.0
  after_seconds: 5.0
  min_song_seconds: 15.0
  merge_gap_seconds: 30.0

output:
  video_clips: true
  audio_segments: true
  audio_extension: m4a
